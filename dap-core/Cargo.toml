[package]
name = "dap-core"
description = "Core DAP proxy library: routing, sessions, registry"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Coditary"]
rust-version = "1.85"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
dap-plugin-api = { path = "../dap-plugin-api" }
dap-protocol = { path = "../dap-protocol" }
instance-manager = { path = "../instance-manager" }
protocol-gateway = { path = "../protocol-gateway" }
protocol-mux = { path = "../protocol-mux" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "io-std", "net", "time"] }
tracing = "0.1"
libc = "0.2"
tree-sitter = "0.24"
tree-sitter-highlight = "0.24"
libloading = "0.8"

[dev-dependencies]
dap-proxy = { path = "../dap-proxy" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
tree-sitter-python = "0.23"
