[workspace]
resolver = "2"
members = [
    "crates/instance-manager",
    "crates/protocol-gateway",
    "crates/protocol-mux",
    "crates/dap-protocol",
    "crates/dap-core",
    "crates/dap-plugin-api",
    "crates/dap-proxy",
    "tests/fixtures/fake-dap-adapter",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Coditary"]
repository = "https://github.com/coditary/dap-core"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

instance-manager = { path = "crates/instance-manager" }
protocol-gateway = { path = "crates/protocol-gateway" }
protocol-mux = { path = "crates/protocol-mux" }
dap-protocol = { path = "crates/dap-protocol" }
dap-core = { path = "crates/dap-core" }
dap-plugin-api = { path = "crates/dap-plugin-api" }
