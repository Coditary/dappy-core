[package]
name = "dap-cli"
description = "CLI for managing DAP proxy sessions and plugins"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Coditary"]
rust-version = "1.85"

[[bin]]
name = "dap-cli"
path = "src/main.rs"

[lib]
name = "dap_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dap-core = { path = "../dap-core" }
dap-plugin-api = { path = "../dap-plugin-api" }
dap-protocol = { path = "../dap-protocol" }
instance-manager = { path = "../instance-manager" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
signal-hook = "0.3"
rustyline = "15"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
dap-proxy = { path = "../dap-proxy" }
fake-dap-adapter = { path = "../tests/fixtures/fake-dap-adapter" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "process", "time"] }
