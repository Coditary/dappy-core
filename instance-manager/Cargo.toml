[package]
name = "instance-manager"
description = "Generic registry and lifecycle management for multiple runtime instances (DAP, LSP, etc.)"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Coditary"]
rust-version = "1.85"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
