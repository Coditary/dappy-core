[package]
name = "dap-protocol"
description = "Debug Adapter Protocol message types and transport framing"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Coditary"]
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "io-std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
